# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase the repo name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}

      - uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.REGISTRY_LOGIN_SERVER_MSFT }}
          username: ${{ secrets.REGISTRY_USERNAME_MSFT }}
          password: ${{ secrets.REGISTRY_PASSWORD_MSFT }}

      - run: |
          docker build . -t ${{ secrets.REGISTRY_LOGIN_SERVER_MSFT }}/privacy-helper:${{ github.sha }}
          docker push ${{ secrets.REGISTRY_LOGIN_SERVER_MSFT }}/privacy-helper:${{ github.sha }}

  deploy-to-staging:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write #This is required for requesting the JWT

    steps:
      - name: Lowercase the repo name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}
      
      - name: Login to Azure
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_MSFT }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_MSFT }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_MSFT }}

      - name: 'Deploy to Staging Slot'
        uses: azure/webapps-deploy@v2
        id: deploy-to-webapp
        with:
          app-name: ${{ vars.WEBAPP_NAME_MSFT }}
          slot-name: 'staging'
          images: ${{ secrets.REGISTRY_LOGIN_SERVER_MSFT }}/privacy-helper:${{ github.sha }}